# Settings for the development tools (see requirements-dev.txt); the program itself needs only requirements.txt

[tool.ruff]
line-length = 150
target-version = "py314"  # annotations are evaluated lazily, so a name can be used before it is defined
extend-exclude = ["android"]  # the Android app's build holds a copy of game/

[tool.ruff.lint]
select = ["E", "F", "W", "B", "PLE", "ANN"]  # rules that catch mistakes, and every parameter and return typed for the IDE; matters of style are left to the code base's own norms
ignore = [
    "ANN401",  # Any marks a value only its user knows the kind of: a menu entry's, a configured option's, or plain data from a save file
    "B008",  # a default made by a call is fine for an immutable object, such as Border()
    "B027",  # an empty method in a base class is a hook its subclasses may override
    "B904",  # the save file turns a low-level error into the one message the player needs
    "B905",  # the zipped lists are built to match: settings options and their choices
    "E731",  # a named lambda is the idiom here for a short local condition
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["ANN"]  # tests need no annotations: nothing outside them calls into them

[tool.pyright]
include = ["game", "ui", "sudoku.py"]
exclude = ["**/tests", "**/__pycache__"]  # the tests are untyped and lean on mocks
typeCheckingMode = "standard"
reportMissingTypeArgument = "error"  # a list, dict or Iterator says what it holds, so the IDE can follow calls into its items

[tool.coverage.run]
branch = true
source = ["game", "ui", "sudoku"]
omit = ["*/tests/*", "*/keyboard_query.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
sort = "cover"
